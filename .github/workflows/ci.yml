name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Provide placeholder values so Next.js static analysis doesn't fail
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          ANTHROPIC_API_KEY: placeholder
          SENDGRID_API_KEY: placeholder
          SENDGRID_FROM_EMAIL: noreply@example.com
          UNIPILE_API_KEY: placeholder
          REDDIT_CLIENT_ID: placeholder
          REDDIT_CLIENT_SECRET: placeholder
          PINECONE_API_KEY: placeholder
          PINECONE_ENVIRONMENT: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
